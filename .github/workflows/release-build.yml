name: Build release candidates
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest tests.test_release tests.test_engine_connection tests.test_model_downloads -q
      - run: python tools/build_release.py
      - run: python tools/smoke_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: directors-cut-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/**/*.zip
            release/**/*.exe
            release/**/DirectorsCut-*-linux-*
            release/**/*.md
            release/**/*.txt
            release/**/*.json
          if-no-files-found: error
